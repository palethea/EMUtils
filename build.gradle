plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'com.gradleup.shadow' version '9.3.1'
}

def mcFamily = (findProperty("mcFamily") ?: "26.x").toString()
def mcVersionOverride = findProperty("mcVersion")?.toString()
// Each Minecraft version builds its own jar from the shared src/26_x code plus its
// version folder (src/26_2 for 26.2), which holds the code that differs between versions.
// Minecraft 26.1.x lives on the legacy/26.1.x branch.
def mc26Versions = [
	"26.2": [
		minecraftVersion: "26.2",
		fabricApiVersion: "0.152.1+26.2",
		mappingFile: "gradle/mappings/26.2-official-identity.tiny",
		minecraftDependency: ">=26.2- <26.3-",
		sodiumVersion: "mc26.2-0.9.0-fabric",
		modMenuVersion: "20.0.2"
	]
]
// supported_mc_versions (gradle.properties) is the release and test matrix; the last entry is the default target.
def supportedMcVersions = project.supported_mc_versions.toString().split(",")*.trim().findAll { it }
supportedMcVersions.each { version ->
	if (!mc26Versions.containsKey(version)) {
		throw new GradleException("supported_mc_versions lists '${version}', which has no build target in build.gradle")
	}
}
def selected26Version = mcVersionOverride ?: supportedMcVersions.last()
if (mcFamily == "26.x" && !mc26Versions.containsKey(selected26Version)) {
	throw new GradleException("Unsupported 26.x mcVersion '${selected26Version}'. Use one of: ${mc26Versions.keySet().join(', ')}")
}
def selected26 = mc26Versions[selected26Version]
def versionPath = "src/${selected26Version.replace('.', '_')}"
if (mcFamily == "26.x" && !file("${versionPath}/resources/emutils.versioned.mixins.json").isFile()) {
	throw new GradleException("Missing ${versionPath}/resources/emutils.versioned.mixins.json for Minecraft ${selected26Version}")
}
def smokeRunDir = (mcFamily == "26.x" && findProperty("emutilsSmokeLaunch")?.toString()?.toBoolean())
	? "run/26x-smoke/${selected26Version}"
	: null
def mcFamilies = [
	"26.x": [
		sourcePath: "src/26_x/client/java",
		resourcePath: "src/26_x/resources",
		versionSourcePath: "${versionPath}/client/java",
		versionResourcePath: "${versionPath}/resources",
		minecraftVersion: selected26.minecraftVersion,
		fabricApiVersion: selected26.fabricApiVersion,
		loaderVersion: "0.19.3",
		javaVersion: 25,
		mappingNamespace: "mojang",
		mappingFile: selected26.mappingFile,
		minecraftDependency: selected26.minecraftDependency,
		minecraftDescription: selected26Version,
		archiveName: "EMUtils-${selected26Version}.jar"
	]
]
def selectedMc = mcFamilies[mcFamily]
if (selectedMc == null) {
	throw new GradleException("Unsupported mcFamily '${mcFamily}'. Use one of: ${mcFamilies.keySet().join(', ')}")
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "NotEnoughUpdates"
		url = "https://maven.notenoughupdates.org/releases/"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
}

configurations {
	shadowModImpl
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("${selectedMc.resourcePath}/emutils.accesswidener")
	fabricModJsonPath = file("${selectedMc.resourcePath}/fabric.mod.json")

	if (selectedMc.mappingNamespace == "mojang") {
		noIntermediateMappings()
	}

	mods {
		"emutils" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	if (smokeRunDir != null) {
		runs {
			client {
				runDir smokeRunDir
			}
		}
	}
}

sourceSets {
	main {
		resources.srcDirs = ["src/main/resources", selectedMc.resourcePath, selectedMc.versionResourcePath]
	}
	client {
		java.srcDirs = [selectedMc.sourcePath, selectedMc.versionSourcePath]
	}
	if (mcFamily == "26.x") {
		xaeroApi {
			java.srcDirs = ["src/26_x/xaero_api/java"]
		}
	}
}

if (mcFamily == "26.x") {
	// Compile-only ABI stubs keep Xaero integration optional and out of the release jar.
	sourceSets.xaeroApi.compileClasspath = configurations.clientCompileClasspath + sourceSets.main.output
	sourceSets.client.compileClasspath += sourceSets.xaeroApi.output
	tasks.named("compileClientJava").configure {
		dependsOn tasks.named("compileXaeroApiJava")
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${selectedMc.minecraftVersion}"
	mappings loom.layered {
		mappings(file(selectedMc.mappingFile)) {
			fallbackNamespaces("official", "named")
		}
	}
	modImplementation "net.fabricmc:fabric-loader:${selectedMc.loaderVersion}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${selectedMc.fabricApiVersion}"
	if (mcFamily == "26.x") {
		modCompileOnly "maven.modrinth:sodium:${selected26.sodiumVersion}"
		// Mod Menu publishes in official mappings, so it needs no Loom remapping here.
		compileOnly "com.terraformersmc:modmenu:${selected26.modMenuVersion}"
	}
	modCompileOnly("net.emhelpers:emhelpers:${project.emhelpers_version}") {
		exclude group: "net.fabricmc.fabric-api"
		exclude group: "net.fabricmc", module: "fabric-loader"
	}
	shadowModImpl("net.emhelpers:emhelpers:${project.emhelpers_version}") {
		exclude group: "net.fabricmc.fabric-api"
		exclude group: "net.fabricmc", module: "fabric-loader"
	}
	include implementation("net.java.dev.jna:jna:5.17.0")
	include implementation("org.glavo:webp:0.2.0")
	modImplementation "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"
	include "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	inputs.property "minecraft_dependency", selectedMc.minecraftDependency
	inputs.property "minecraft_description", selectedMc.minecraftDescription
	inputs.property "java_version", selectedMc.javaVersion
	inputs.property "loader_version", selectedMc.loaderVersion

	filesMatching("fabric.mod.json") {
		expand(
			"version": version,
			"minecraft_dependency": selectedMc.minecraftDependency,
			"minecraft_description": selectedMc.minecraftDescription,
			"java_version": selectedMc.javaVersion,
			"loader_version": selectedMc.loaderVersion
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = selectedMc.javaVersion
	javaCompiler = javaToolchains.compilerFor {
		languageVersion = JavaLanguageVersion.of(selectedMc.javaVersion)
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(selectedMc.javaVersion)
	targetCompatibility = JavaVersion.toVersion(selectedMc.javaVersion)
}

tasks.matching { it.name == "remapSourcesJar" }.configureEach {
	enabled = selectedMc.mappingNamespace != "mojang"
}

tasks.matching { it.name == "runClient" }.configureEach {
	if (mcFamily == "26.x" && findProperty("emutilsSmokeLaunch")?.toString()?.toBoolean()) {
		jvmArgs "-Demutils.smokeLaunch=true"
		jvmArgs "-Demutils.launchTestWorld=true"
	}
	if (mcFamily == "26.x" && findProperty("emutilsLaunchTestWorld")?.toString()?.toBoolean()) {
		jvmArgs "-Demutils.launchTestWorld=true"
	}
	if (mcFamily == "26.x") {
		File emHelpersDir = file("../EMHelpers")
		if (emHelpersDir.isDirectory()) {
			classpath += files(
				"${emHelpersDir}/build/classes/java/main",
				"${emHelpersDir}/build/classes/java/client"
			)
		}
	}
}

tasks.named("jar") {
	archiveClassifier.set("dev")
}

tasks.named("shadowJar") {
	dependsOn tasks.named("jar")
	from(tasks.named("jar").flatMap { it.archiveFile }.map { zipTree(it) })
	archiveClassifier.set("dev-shadow")
	configurations = [project.configurations.shadowModImpl]
	relocate "net.emhelpers", "net.emutils.client.shadow.emhelpers"
	mergeServiceFiles()
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named("remapJar") {
	dependsOn tasks.shadowJar
	inputFile.set(tasks.shadowJar.archiveFile)
	archiveFileName = selectedMc.archiveName
	if (selectedMc.mappingNamespace == "mojang") {
		doLast {
			def remappedJar = archiveFile.get().asFile
			def shadowClassesDir = layout.buildDirectory.dir("tmp/remapShadowMerge/${mcFamily}").get().asFile
			delete(shadowClassesDir)
			copy {
				from(zipTree(tasks.shadowJar.archiveFile.get().asFile)) {
					include "net/emutils/client/shadow/**"
				}
				into shadowClassesDir
			}
			ant.zip(destfile: remappedJar, update: true) {
				zipfileset(dir: shadowClassesDir, includes: "net/emutils/client/shadow/**")
			}
		}
	}
}
