plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'com.gradleup.shadow' version '9.3.1'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases/"
	}
	maven {
		name = "NotEnoughUpdates"
		url = "https://maven.notenoughupdates.org/releases/"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
}

configurations {
	shadowModImpl
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/emutils.accesswidener")

	mods {
		"emutils" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modCompileOnly("net.emhelpers:emhelpers:${project.emhelpers_version}") {
		exclude group: "net.fabricmc.fabric-api"
		exclude group: "net.fabricmc", module: "fabric-loader"
	}
	shadowModImpl("net.emhelpers:emhelpers:${project.emhelpers_version}") {
		exclude group: "net.fabricmc.fabric-api"
		exclude group: "net.fabricmc", module: "fabric-loader"
	}
	include implementation("org.glavo:webp:0.2.0")
	modImplementation "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"
	include "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.named("jar") {
	archiveClassifier.set("dev")
}

tasks.named("shadowJar") {
	dependsOn tasks.named("jar")
	from(tasks.named("jar").flatMap { it.archiveFile }.map { zipTree(it) })
	archiveClassifier.set("dev-shadow")
	configurations = [project.configurations.shadowModImpl]
	relocate "net.emhelpers", "net.emutils.client.shadow.emhelpers"
	mergeServiceFiles()
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named("remapJar") {
	dependsOn tasks.shadowJar
	inputFile.set(tasks.shadowJar.archiveFile)
	archiveFileName = "EMUtils.jar"
}
